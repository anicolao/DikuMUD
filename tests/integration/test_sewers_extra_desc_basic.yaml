# Test: Basic extra description test for sewers
# Simple test to verify extra descriptions work

test:
  id: test_sewers_extra_desc_basic
  description: "Verify basic extra description in room 3151"
  author: Integration Test Framework
  created: 2025-10-22
  tags: [sewers, extra_descriptions]

setup:
  character:
    name: ExtraDescTester
    password: test
    class: warrior
    level: 22
  start_room: 1200  # Start in well-lit Chat Room
  gold: 0

steps:
  - action: command
    command: "load obj 3531"
    description: "Load glow crystal (same as guildmaster gives new players)"
    expected:
      - pattern: "."

  - action: command
    command: "get crystal"
    description: "Get crystal"
    expected:
      - pattern: "."

  - action: command
    command: "hold crystal"
    description: "Hold crystal for light"
    expected:
      - pattern: "."

  - action: command
    command: "goto 3151"
    description: "Teleport to Main Sewer Tunnel"
    expected:
      - pattern: "."

  - action: command
    command: "look"
    description: "Look at room - should see it now with light"
    expected:
      - pattern: "Sewer"

  - action: command
    command: "look channel"
    description: "Look at channel - should show extra description"
    expected:
      - pattern: "."

  - action: command
    command: "look panel"
    description: "Look at panel - should show extra description"
    expected:
      - pattern: "compartment"
