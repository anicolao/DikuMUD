# Test for secret door feature in the sewers
# This test validates that secret doors work correctly:
# 1. They are hidden when closed (not in exits, not visible when looking in direction)
# 2. They can be discovered through room descriptions
# 3. They can be opened by keyword
# 4. Once opened, they become visible

test:
  id: test_secret_doors_sewers
  description: "Verify secret door functionality in Ancient Eastern Passage (room 3165)"
  author: Integration Test Framework
  created: 2025-10-20
  tags: [secret_doors, sewers, feature_test]

setup:
  character:
    name: TestSecretDoor
    password: test
    class: warrior
    level: 1
  start_room: 3165  # Ancient Eastern Passage with secret door
  gold: 100

steps:
  - action: command
    command: "look"
    description: "Look at the room - should see room name at minimum"
    expected:
      - pattern: "."
        message: "Should see something"

  - action: command
    command: "look south"
    description: "Looking south should show nothing special (secret door hidden)"
    expected:
      - pattern: "Nothing special there"
        message: "Should not see the secret door when looking south"
    fail_on:
      - pattern: "passage|hatch|debris"
        message: "Should not see door description when looking in that direction"

  - action: command
    command: "look floor"
    description: "Examine the floor to discover the secret door clue"
    expected:
      - pattern: "floor stones.*don't quite fit properly|gaps around their edges|disturbed recently"
        message: "Should see extra description about the odd floor stones"

  - action: command
    command: "open hatch"
    description: "Open the secret door using the keyword from the description"
    expected:
      - pattern: "Ok"
        message: "Should successfully open the secret door"

  - action: look
    description: "After opening, the exit should now be visible"
    expected:
      - pattern: ">-- Exits:.*S"
        message: "Secret door to south SHOULD now appear in exits after being opened"

  - action: command
    command: "look south"
    description: "Looking south should now show the passage"
    expected:
      - pattern: "passage|partially blocked by debris"
        message: "Should now see the door description after opening"
    fail_on:
      - pattern: "Nothing special there"
        message: "Should no longer hide the exit after opening"

  - action: move
    direction: south
    description: "Move through the now-visible secret door"
    expected:
      - pattern: "Secret Lower Level Access"
        message: "Should be able to move through the opened secret door"

result:
  should_pass: true
  description: "Secret doors should be hidden until discovered and opened"
  notes: |
    This test validates the secret door feature:
    - Secret doors don't show in exits when closed
    - Looking in the direction shows nothing special
    - Room descriptions contain clues to find them
    - Keywords from descriptions can be used to open them
    - Once opened, they become visible and function like normal doors
