# Integration test for mob 3007 with multiple quest assignments
# Tests that mob 3007 can offer different quests by completing them
test:
  id: quest_3007_multiple_quests
  description: "Test that mob 3007 offers different quests (3001 and 3002)"
  author: Integration Test Framework
  created: 2025-10-18
  tags: [quest, multiple_quests, mob_3007]

setup:
  character:
    name: MultiQuestTest
    password: test
    level: 23
    class: warrior
  start_room: 3001  # Temple area
  gold: 1000

steps:
  # Step 1: Navigate to the Warriors Guild where mob 3007 is located
  - action: command
    command: "goto 3021"
    description: "Teleport to Warriors Guild entrance (room 3021)"
    expected:
      - pattern: "."
        message: "Should teleport successfully"

  # Step 2: Verify the Red Martian Warrior is in the room
  - action: look
    description: "Look at the room to see the Red Martian Warrior"
    expected:
      - pattern: "Red Martian warrior|Red Martian Warrior"
        message: "Red Martian Warrior should be in the room"

  # Step 3: Get first quest - should be Quest 3001 (KILL type 63)
  - action: command
    command: "ask warrior quest"
    description: "Ask warrior for quest - should get quest 3001 (Guard's Training)"
    expected:
      - pattern: "recruit|ulsio|sewers"
        message: "Should receive Quest 3001 about killing ulsio in sewers"

  # Step 4: Ask again - should now offer Quest 3002 (different type)
  # Since player has KILL quest (type 63), warrior offers EXPLORE quest (type 64)
  - action: command
    command: "ask warrior quest"
    description: "Ask warrior again - should offer Quest 3002 (different type)"
    expected:
      - pattern: "patrol|plaza|market"
        message: "Should offer Quest 3002 since it's a different type (EXPLORE vs KILL)"

  # Step 5: Ask a third time - now should say "already have" for both types
  - action: command
    command: "ask warrior quest"
    description: "Ask again after having both quest types"
    expected:
      - pattern: "no tasks|already"
        message: "Should say no tasks available or already have one"

  # Step 6: Verify we have both quests active
  - action: command
    command: "score"
    description: "Check score to see both quests"
    expected:
      - pattern: "Quest"
        message: "Should show active quests"

result:
  should_pass: true
  description: |
    This test verifies that mob 3007 (Red Martian Warrior) can offer multiple
    different quests to the same player simultaneously! The mob has 3 quests:
    - Quest 3001: Guard's Training (KILL quest - type 63)
    - Quest 3002: Market Patrol (EXPLORE quest - type 64)
    - Quest 3602: Intelligence Gathering (EXPLORE quest - type 64)
    
    The test demonstrates:
    1. Player receives Quest 3001 (KILL type) when first asking
    2. Player receives Quest 3002 (EXPLORE type) when asking again, because
       it's a different quest type and the player doesn't have it yet
    3. After having both quest types active, warrior says "no tasks available"
    
    This proves that mob 3007 successfully offers MULTIPLE DIFFERENT QUESTS
    from its pool of 3 quests. The player can have Quest 3001 and 3002 active
    simultaneously because they are different types (KILL vs EXPLORE).
    
    Quest 3602 is also EXPLORE type like 3002, so both cannot be active at once,
    but the quest data confirms all 3 exist and are assigned to mob 3007.
  notes: |
    This test uses the enhanced find_available_quest() function which allows
    NPCs to offer different quests based on quest type. A player can have
    multiple quests active as long as they are different types.
