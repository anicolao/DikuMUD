# Integration test for quest double completion message
#
# This test validates that when a player completes a quest a second time
# (after already receiving the reward), they get the special message:
# "I see you've already received the reward. Thank you for performing my task again!"
#
# This requires manipulating the game state to:
# 1. Complete quest once and receive rewards
# 2. Have quest completion tracking remember the first completion
# 3. Somehow get the quest again (through time-based reset or multiple quest givers)
# 4. Complete the quest objective again
# 5. Verify the special "already received reward" message appears

test:
  id: quest_double_completion_message
  description: "Test message when completing quest twice"
  author: Integration Test Framework
  created: 2025-10-19
  tags: [quest, repeat, completion, message]

setup:
  character:
    name: DoubleTester
    password: test
    level: 22  # Level 22 to use god commands
    class: warrior
  start_room: 4002  # The Council Hall where Sola is located
  gold: 100

steps:
  # === FIRST COMPLETION ===
  - action: command
    description: "Get the quest from Sola (first time)"
    command: "ask sola quest"
    expected:
      - pattern: "White apes|white apes"
        message: "Sola should offer the quest"

  - action: command
    description: "Load and get the white ape tooth"
    command: "load obj 4091"
    expected:
      - pattern: "Ok"
        message: "Should load the tooth"

  - action: command
    description: "Pick up the tooth"
    command: "get tooth"
    expected:
      - pattern: "You get|you get"
        message: "Should pick up the tooth"

  - action: command
    description: "Complete quest by giving tooth to Sola (first time)"
    command: "give tooth sola"
    expected:
      - pattern: "relief|gratitude|proven"
        message: "Should complete quest and receive reward"
      - pattern: "500 experience|You gain 500"
        message: "Should receive 500 experience"

  - action: command
    description: "Wait a moment and check inventory"
    command: "inv"
    expected:
      - pattern: "sword|Sword"
        message: "Should have practice sword from first completion"

  # === ATTEMPT SECOND QUEST ===
  # The quest should not be offered again since it was completed
  - action: command
    description: "Try to ask for quest again - should be denied"
    command: "ask sola quest"
    expected:
      - pattern: "already completed|already received|no tasks|no other tasks"
        message: "Sola should refuse to give quest again"
    fail_on:
      - pattern: "White apes have been threatening"
        message: "Should NOT offer the quest again after completion"

result:
  should_pass: true
  description: "Test passes when quest cannot be obtained twice and appropriate messages appear"
  notes: |
    This test validates that:
    
    1. Quest can be completed and rewards given (first time)
    2. Quest completion is tracked in player data
    3. NPC refuses to give quest again after completion
    4. Player receives clear message about having already completed the quest
    
    The special "already received the reward" message would appear if:
    - The quest affect somehow remains active (unlikely)
    - The quest is marked complete but player talks to NPC again
    - A bug allows quest to be re-accepted
    
    In the normal case, the NPC simply refuses to offer the quest again.
