# Integration test for quest repeat completion tracking
#
# This test validates that once a player has received the reward for a quest,
# they can complete it again but will receive a different message and no
# additional rewards.
#
# Test Flow:
# 1. Complete Sola's quest and receive rewards
# 2. Get the quest again and complete it a second time
# 3. Verify player gets "already received reward" message
# 4. Try to get the quest a third time and verify it's not offered

test:
  id: quest_repeat_completion
  description: "Test that completed quests don't give rewards twice"
  author: Integration Test Framework
  created: 2025-10-19
  tags: [quest, repeat, completion, tracking]

setup:
  character:
    name: RepeatTester
    password: test
    level: 22  # Level 22 to use 'load' command for testing
    class: warrior
  start_room: 4002  # The Council Hall where Sola is located
  gold: 100

steps:
  # First completion - should get full rewards
  - action: command
    description: "Get the quest from Sola"
    command: "ask sola quest"
    expected:
      - pattern: "White apes|white apes|apes|tooth"
        message: "Sola should offer the quest"

  - action: command
    description: "Load the white ape tooth"
    command: "load obj 4091"
    expected:
      - pattern: "Ok"
        message: "Should load the tooth"

  - action: command
    description: "Get the tooth"
    command: "get tooth"
    expected:
      - pattern: "You get|you get"
        message: "Should pick up the tooth"

  - action: command
    description: "Complete quest by giving tooth to Sola"
    command: "give tooth sola"
    expected:
      - pattern: "relief|gratitude|proven|reward|sword"
        message: "Should complete quest and receive reward"
      - pattern: "experience|Experience"
        message: "Should receive experience"
      - pattern: "practice sword|Practice Sword"
        message: "Should receive practice sword"

  # Wait a moment for quest to be fully completed
  - action: command
    description: "Check inventory to confirm we have sword"
    command: "inv"
    expected:
      - pattern: "sword|Sword"
        message: "Should have practice sword"

  # Second completion - get quest again (now allowed to see hints)
  - action: command
    description: "Get the quest again - should be offered"
    command: "ask sola quest"
    expected:
      - pattern: "White apes|white apes"
        message: "Should be able to get quest again to remember hints"

  # Complete the quest a second time
  - action: command
    description: "Load another white ape tooth"
    command: "load obj 4091"
    expected:
      - pattern: "Ok"
        message: "Should load another tooth"

  - action: command
    description: "Get the second tooth"
    command: "get tooth"
    expected:
      - pattern: "You get|you get"
        message: "Should pick up the tooth"

  - action: command
    description: "Give the tooth again - should see hint but no reward"
    command: "give tooth sola"
    expected:
      - pattern: "relief|gratitude"
        message: "Should see completion text with hint"
      - pattern: "already received the reward"
        message: "Should see message about already receiving reward"
    fail_on:
      - pattern: "500 experience|You gain 500"
        message: "Should NOT receive experience again"

result:
  should_pass: true
  description: "Test passes when player cannot get rewards twice for same quest"
  notes: |
    This test validates the quest completion tracking system:
    
    1. Player completes quest and receives rewards (first time)
    2. Quest completion is marked in player data (bitfield)
    3. Player cannot get the quest again (NPC refuses)
    4. If player somehow completes objective again, no rewards given
    
    The implementation uses a 128-bit bitfield (two 64-bit fields) to track
    which quests each player has completed and received rewards for.
