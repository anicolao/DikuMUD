# Integration test for Quest 3003 - Calot Feeding (RETRIEVAL)
test:
  id: quest_3003_calot_feeding
  description: "Test Lesser Helium calot feeding quest - retrieve dried meat from sewers"
  author: Integration Test Framework
  created: 2025-10-12
  tags: [quest, lesser_helium, retrieval]

setup:
  character:
    name: CalotFeeder
    password: test
    level: 5
    class: warrior
  start_room: 3031  # Where Beast-Handler is located
  gold: 100

steps:
  - action: look
    description: "Verify we're in the room with Beast-Handler"
    expected:
      - pattern: "beast-handler|Beast-Handler"
        message: "Beast-Handler should be present"

  - action: command
    description: "Ask Beast-Handler for quest"
    command: "ask handler quest"
    expected:
      - pattern: "calot|meat|dried|sewer|carrion|bird|feed"
        message: "Beast-Handler should offer calot feeding quest"

  - action: command
    description: "Check quest status"
    command: "score"
    expected:
      - pattern: "Quest|quest"
        message: "Should show active quest"
        optional: true

result:
  should_pass: true
  description: "Test passes when retrieval quest can be assigned"
