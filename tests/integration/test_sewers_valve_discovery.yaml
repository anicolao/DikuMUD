# Test: Use rope with valve mechanism in sewers
# Tests the YAML-based object special procedure for the sewers deep discovery feature

test:
  id: test_sewers_valve_discovery
  description: "Verify rope can be used with valve mechanism for XP reward"
  author: Integration Test Framework
  created: 2025-10-21
  tags: [sewers, discovery, special_procedure]

setup:
  character:
    name: ValveTester
    password: test
    class: warrior
    level: 22  # Need level 22+ for 'load obj' command
  start_room: 1200  # Start in well-lit Chat Room
  gold: 0

steps:
  - action: command
    command: "load obj 3224"
    description: "Load a rope for testing"
    expected:
      - pattern: "Ok"

  - action: command
    command: "get rope"
    description: "Get the rope"
    expected:
      - pattern: "."

  - action: command
    command: "hold rope"
    description: "Hold the rope while still in lit room"
    expected:
      - pattern: "."

  - action: command
    command: "use rope valve"
    description: "Try to use rope when not in valve room - should fail"
    expected:
      - pattern: "near the valve mechanism"

  - action: command
    command: "goto 3157"
    description: "Teleport to Deep Sewer Chamber (valve room)"
    expected:
      - pattern: "."

  - action: command
    command: "use rope valve"
    description: "Use rope with valve - should succeed"
    expected:
      - pattern: "loop the rope through the pulley"
        message: "Should activate valve mechanism"
      - pattern: "100 experience"
        message: "Should gain discovery XP"
