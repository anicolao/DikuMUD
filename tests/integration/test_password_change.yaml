# Test password change functionality
# Verifies that a player can change their password and log back in with the new password

test:
  id: test_password_change
  description: "Verify password change works correctly and player can log in with new password"
  author: Integration Test Framework
  created: 2025-10-19
  tags: [password, authentication, security]

setup:
  character:
    name: PwdTest
    password: oldpass123
    class: warrior
    level: 1
  start_room: 3001

steps:
  - action: look
    description: "Initial connection to verify character works"
    expected:
      - pattern: "Lesser Helium"
        message: "Should be in Lesser Helium"

  # Enter the menu to change password
  - action: send
    input: "0"
    description: "Exit to main menu"
    expected:
      - pattern: "MENU"
        message: "Should see the menu"

  # Select option 4 to change password
  - action: send
    input: "4"
    description: "Select password change option"
    expected:
      - pattern: "Enter a new password"
        message: "Should prompt for new password"

  # Enter new password
  - action: send
    input: "newpass456"
    description: "Enter new password"
    expected:
      - pattern: "Please retype password"
        message: "Should ask to confirm password"

  # Confirm new password
  - action: send
    input: "newpass456"
    description: "Confirm new password"
    expected:
      - pattern: "Done"
        message: "Password change should succeed"
      - pattern: "MENU"
        message: "Should return to menu"

  # Enter the game to save the password change
  - action: send
    input: "1"
    description: "Enter game to finalize password change"
    expected:
      - pattern: "Lesser Helium"
        message: "Should enter the game"

  # Exit and disconnect
  - action: quit
    description: "Quit to save character"
    expected:
      - pattern: "Goodbye"
        message: "Should quit successfully"

result:
  should_pass: true
  description: "Password change should succeed and be saved to player file"
