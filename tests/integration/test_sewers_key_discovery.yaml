# Test: Use iron key with maintenance panel in sewers
# Tests the YAML-based object special procedure for the sewers deep discovery feature

test:
  id: test_sewers_key_discovery
  description: "Verify iron key can be used with maintenance panel for XP reward"
  author: Integration Test Framework
  created: 2025-10-21
  tags: [sewers, discovery, special_procedure]

setup:
  character:
    name: KeyTester
    password: test
    class: warrior
    level: 22  # Need level 22+ for 'load obj' command
  start_room: 1200  # Start in well-lit Chat Room
  gold: 0

steps:
  - action: command
    command: "load obj 3221"
    description: "Load an iron key for testing"
    expected:
      - pattern: "Ok"

  - action: command
    command: "get key"
    description: "Get the key"
    expected:
      - pattern: "."

  - action: command
    command: "hold key"
    description: "Hold the key while still in lit room"
    expected:
      - pattern: "."

  - action: command
    command: "use key panel"
    description: "Try to use key when not in panel room - should fail"
    expected:
      - pattern: "near the maintenance panel"

  - action: command
    command: "goto 3151"
    description: "Teleport to Main Sewer Tunnel (panel room)"
    expected:
      - pattern: "."

  - action: command
    command: "use key panel"
    description: "Use key with panel - should succeed and give rewards"
    expected:
      - pattern: "insert the ancient iron key"
        message: "Should unlock panel"
      - pattern: "75 experience"
        message: "Should gain discovery XP"
      - pattern: "ancient engineering tool set"
        message: "Should find tool set"
      - pattern: "ancient engineering diagram"
        message: "Should find diagram"

  - action: command
    command: "inventory"
    description: "Verify rewards are in inventory"
    expected:
      - pattern: "."
